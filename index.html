<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NO SIGNAL® — Official Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background: #fff;
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #000;
            position: relative;
        }

        .logo-small {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a, .dropdown-btn {
            color: #ccc;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: none;
            border: none;
            cursor: pointer;
        }

        nav a:hover, .dropdown-btn:hover {
            color: #fff;
        }

        /* Dropdown Menu for SHOP */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #000;
            border: 1px solid #222;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.8);
            z-index: 10;
            padding: 10px 0;
            margin-top: 5px;
        }

        .dropdown-content a {
            color: #888;
            padding: 8px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.75rem;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #111;
            color: #fff;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=1770') center/cover;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: #ccc;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .btn-main {
            background: #fff;
            color: #000;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-decoration: none;
            text-transform: uppercase;
            cursor: default;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 0.1em;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        FREE SHIPPING ON ORDERS OVER $100 — COMING SOON
    </div>

    <header>
        <div class="logo-small">NO SIGNAL®</div>
        <nav>
            <div class="dropdown">
                <button class="dropdown-btn">SHOP ▾</button>
                <div class="dropdown-content">
                    <a href="#">HOODIES</a>
                    <a href="#">T-SHIRTS</a>
                    <a href="#">SHIRTS</a>
                    <a href="#">ACCESSORIES</a>
                </div>
            </div>
            <a href="https://www.tiktok.com/@nonsignalofficialproject" target="_blank">TIKTOK</a>
        </nav>
    </header>

    <section class="hero">
        <h1>NO SIGNAL®</h1>
        <p>CLOTHING COMPANY — EST. 2024</p>
        <div class="btn-main">COMING SOON</div>
    </section>

    <footer>
        &copy; 2026 NO SIGNAL®. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>
